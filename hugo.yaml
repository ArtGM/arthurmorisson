baseURL: "https://arthurmorisson.fr"
languageCode: "fr-fr"
# Pilote l'attribut <html lang>. languageCode ne sert qu'au flux RSS :
# sans cette ligne Hugo retombe sur "en" et le site se déclare anglophone.
defaultContentLanguage: "fr"
title: "Arthur Morisson"
theme: hugo-profile

enableRobotsTXT: true

# Taxonomies désactivées : aucun article n'a encore de tag ni de catégorie, donc
# /categories/ et /tags/ seraient des pages vides indexables.
# Retirer ce bloc dès qu'un article publie de vrais tags.
disableKinds:
  - taxonomy
  - term

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

menus:
  main:
    - identifier: depannage
      name: "Dépannage"
      title: "Dépannage de site web en urgence"
      url: "/depannage-urgence/"
      weight: 1
    - identifier: creation
      name: "Création de site"
      title: "Création de site vitrine et de boutique en ligne"
      url: "/creation-site/"
      weight: 2
    - identifier: integration
      name: "Connexion d'outils"
      title: "Connecter vos outils entre eux"
      url: "/integration-outils/"
      weight: 3
    - identifier: realisations
      name: "Réalisations"
      title: "Toutes mes réalisations"
      url: "/realisations/"
      weight: 4
    - identifier: blog
      name: "Blog"
      title: "Blog"
      url: "/blog/"
      weight: 5
    - identifier: contact
      name: "Contact"
      title: "Me contacter"
      url: "/contact/"
      weight: 6

