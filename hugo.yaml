    <!-- Background pixel drift -->
    <canvas id="bg-particles" aria-hidden="true"></canvas>
    <style>
      #bg-particles {
        position: fixed !important;
        inset: 0;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 9999;
        pointer-events: none;
        background: transparent !important;
      }
    </style>
    <script>
    (function () {
      var canvas = document.getElementById('bg-particles');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var width, height, particles;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        width = canvas.width = Math.floor(window.innerWidth * dpr);
        height = canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
      }

      function init() {
        resize();
        var count = Math.min(70, Math.floor((window.innerWidth * window.innerHeight) / 22000));
        particles = [];
        for (var i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.25 * dpr,
            vy: (Math.random() - 0.5) * 0.25 * dpr,
            size: (Math.random() < 0.7 ? 1 : 2) * dpr,
            alpha: Math.random() * 0.5 + 0.25
          });
        }
      }

      function color() {
        return document.body.classList.contains('dark')
          ? '255, 255, 255'
          : '90, 90, 90';
      }

      function tick() {
        ctx.clearRect(0, 0, width, height);
        var c = color();
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;
          ctx.fillStyle = 'rgba(' + c + ',' + p.alpha + ')';
          ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        }
        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', init);
      init();
      if (!reduced) tick();
      else {
        ctx.clearRect(0, 0, width, height);
        var c = color();
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          ctx.fillStyle = 'rgba(' + c + ',' + p.alpha + ')';
          ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        }
      }
    })();
    </script>
