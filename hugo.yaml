  customScripts: |-
    <!-- Mesure d'audience Google Analytics 4, sous consentement.

         GA4 dépose des cookies non exemptés de consentement, donc rien n'est
         chargé avant un accord explicite. Tant que GA4_ID vaut la valeur
         d'exemple, ni le bandeau ni le script ne s'affichent : remplacer la
         valeur par l'identifiant de mesure (format G-XXXXXXXXXX) pour activer.

         Le choix est mémorisé dans localStorage. Pour revenir dessus, il faut
         effacer les données de site, ce qui est indiqué dans la page
         /confidentialite/. -->
    <style>
      #consent-banner {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 10000;
        padding: 0.7rem 1rem;
        background-color: var(--secondary-color);
        color: var(--text-color);
        box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.12);
        font-size: 0.9rem;
        line-height: 1.4;
      }
      #consent-banner .consent-inner {
        max-width: 56rem;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        align-items: center;
        justify-content: space-between;
      }
      #consent-banner p {
        margin: 0;
        flex: 1 1 22rem;
      }
      #consent-banner a {
        color: var(--text-link-color);
      }
      #consent-banner .consent-actions {
        display: flex;
        gap: 0.5rem;
      }
      #consent-banner button {
        min-height: 44px;
        padding: 0.5rem 1.25rem;
        border-radius: 0.75rem;
        border: 1px solid var(--primary-color);
        background: transparent;
        color: var(--text-color);
        font: inherit;
        cursor: pointer;
      }
      #consent-banner button.consent-accept {
        background-color: var(--primary-color);
        /* Pas de #fff en dur : en mode sombre l'accent est un teal clair, et du
           blanc dessus tombait sous 2:1. La couleur de fond de page donne du
           texte sombre sur accent clair et inversement. */
        color: var(--background-color);
      }
    </style>
    <script>
    (function () {
      var GA4_ID = 'G-3CBH4S6P5C';
      var KEY = 'consent-analytics';
      var loaded = false;

      function read() {
        try { return localStorage.getItem(KEY); } catch (e) { return null; }
      }
      function write(value) {
        try { localStorage.setItem(KEY, value); } catch (e) {}
      }

      function loadAnalytics() {
        if (loaded) return;
        loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA4_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA4_ID, { anonymize_ip: true });
      }

      function showBanner() {
        if (document.getElementById('consent-banner')) return;
        var el = document.createElement('div');
        el.id = 'consent-banner';
        el.setAttribute('role', 'dialog');
        el.setAttribute('aria-label', 'Consentement à la mesure d\'audience');
        el.innerHTML =
          '<div class="consent-inner">' +
            '<p>Mesure d\'audience Google Analytics. Aucune publicité, aucun profilage, ' +
            'rien sans votre accord. <a href="/confidentialite/">Détails</a>.</p>' +
            '<div class="consent-actions">' +
              '<button type="button" class="consent-refuse">Refuser</button>' +
              '<button type="button" class="consent-accept">Accepter</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(el);
        el.querySelector('.consent-accept').addEventListener('click', function () {
          write('granted');
          el.remove();
          loadAnalytics();
        });
        el.querySelector('.consent-refuse').addEventListener('click', function () {
          var wasGranted = loaded;
          write('denied');
          el.remove();
          /* Si la mesure tournait déjà dans cette page, seul un rechargement
             l'arrête réellement : gtag ne se désinstalle pas. */
          if (wasGranted) location.reload();
        });
      }

      /* Lien "Gérer mes cookies" du pied de page : réaffiche le choix. */
      function bindManageLinks() {
        var links = document.querySelectorAll('[data-consent-manage]');
        for (var i = 0; i < links.length; i++) {
          links[i].hidden = false;
          links[i].addEventListener('click', function (e) {
            e.preventDefault();
            showBanner();
          });
        }
      }

      function start() {
        bindManageLinks();
        var stored = read();
        if (stored === 'granted') { loadAnalytics(); return; }
        if (stored === 'denied') return;
        showBanner();
      }

      if (GA4_ID.indexOf('XXXX') !== -1) return;

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
      } else {
        start();
      }
    })();
    </script>
    <!-- Fin mesure d'audience -->

    <!-- Reconstitution des numéros de téléphone masqués.

         Le numéro n'est jamais écrit en clair dans le HTML : le partial
         contact-phone.html pose deux moitiés encodées en base64. Mode "wa" rend
         un lien WhatsApp, mode "legal" un lien tel: pour les mentions légales. -->
    <script>
    (function () {
      var slots = document.querySelectorAll('[data-tel-a]');
      if (!slots.length) return;
      for (var i = 0; i < slots.length; i++) {
        var el = slots[i];
        var n;
        try { n = atob(el.dataset.telA) + atob(el.dataset.telB); } catch (e) { continue; }
        var pretty = n.replace(/(\d{2})(?=\d)/g, '$1 ').trim();
        var intl = '33' + n.slice(1);
        var a = document.createElement('a');
        if (el.dataset.telMode === 'legal') {
          a.href = 'tel:+' + intl;
          a.textContent = pretty;
        } else {
          a.href = 'https://wa.me/' + intl;
          a.rel = 'noopener';
          a.textContent = 'WhatsApp au ' + pretty;
        }
        el.textContent = '';
        el.appendChild(a);
      }
    })();
    </script>

    <!-- Background pixel drift -->
    <canvas id="bg-particles" aria-hidden="true"></canvas>
    <style>
      #bg-particles {
        position: fixed !important;
        inset: 0;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 9999;
        pointer-events: none;
        background: transparent !important;
      }
    </style>
    <script>
    (function () {
      var canvas = document.getElementById('bg-particles');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var width, height, particles;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        width = canvas.width = Math.floor(window.innerWidth * dpr);
        height = canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
      }

      function init() {
        resize();
        var count = Math.min(70, Math.floor((window.innerWidth * window.innerHeight) / 22000));
        particles = [];
        for (var i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.25 * dpr,
            vy: (Math.random() - 0.5) * 0.25 * dpr,
            size: (Math.random() < 0.7 ? 1 : 2) * dpr,
            alpha: Math.random() * 0.5 + 0.25
          });
        }
      }

      function color() {
        return document.body.classList.contains('dark')
          ? '255, 255, 255'
          : '90, 90, 90';
      }

      function tick() {
        ctx.clearRect(0, 0, width, height);
        var c = color();
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;
          ctx.fillStyle = 'rgba(' + c + ',' + p.alpha + ')';
          ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        }
        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', init);
      init();
      if (!reduced) tick();
      else {
        ctx.clearRect(0, 0, width, height);
        var c = color();
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          ctx.fillStyle = 'rgba(' + c + ',' + p.alpha + ')';
          ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        }
      }
    })();
    </script>
