    <!-- Background pixel drift -->
    <canvas id="bg-particles" aria-hidden="true"></canvas>
    <style>
      #bg-particles {
        position: fixed !important;
        inset: 0;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 9999;
        pointer-events: none;
        background: transparent !important;
      }
    </style>
    <script>
    (function () {
      var canvas = document.getElementById('bg-particles');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var width, height, particles;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        width = canvas.width = Math.floor(window.innerWidth * dpr);
        height = canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
      }

      function init() {
        resize();
        var count = Math.min(70, Math.floor((window.innerWidth * window.innerHeight) / 22000));
        particles = [];
        for (var i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.25 * dpr,
            vy: (Math.random() - 0.5) * 0.25 * dpr,
            size: (Math.random() < 0.7 ? 1 : 2) * dpr,
            alpha: Math.random() * 0.5 + 0.25
          });
        }
      }

      function color() {
        return document.body.classList.contains('dark')
          ? '255, 255, 255'
          : '90, 90, 90';
      }

      function tick() {
        ctx.clearRect(0, 0, width, height);
        var c = color();
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;
          ctx.fillStyle = 'rgba(' + c + ',' + p.alpha + ')';
          ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        }
        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', init);
      init();
      if (!reduced) tick();
      else {
        ctx.clearRect(0, 0, width, height);
        var c = color();
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          ctx.fillStyle = 'rgba(' + c + ',' + p.alpha + ')';
          ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        }
      }
    })();
    </script>

    <!-- Hero headings: particle text -->
    <style>
      #hero h1, #hero h2 {
        position: relative;
        overflow: visible;
      }
      .particle-holder {
        display: block;
        position: relative;
      }
      .particle-canvas {
        position: absolute;
        pointer-events: none;
        touch-action: none;
      }
      .particle-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script>
    (function () {
      function wrapLines(mctx, text, maxWidth) {
        var words = text.split(/\s+/);
        var lines = [];
        var line = '';
        for (var i = 0; i < words.length; i++) {
          var test = line ? line + ' ' + words[i] : words[i];
          if (mctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = words[i];
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
        return lines;
      }

      function build(heading) {
        if (!heading || heading.dataset.particled === '1') return;
        var text = heading.textContent.trim();
        if (!text) return;

        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var cs = getComputedStyle(heading);
        var fontSize = parseFloat(cs.fontSize);
        var fontWeight = cs.fontWeight || '400';
        var fontFamily = cs.fontFamily || 'sans-serif';
        var lineHeight = parseFloat(cs.lineHeight);
        if (!lineHeight || isNaN(lineHeight)) lineHeight = fontSize * 1.2;
        var textColor = cs.color;
        var availableWidth = heading.clientWidth || heading.parentElement.clientWidth || 800;

        heading.dataset.particled = '1';

        var font = fontWeight + ' ' + fontSize + 'px ' + fontFamily;

        // Offscreen measurement + line wrap
        var measure = document.createElement('canvas');
        var mctx = measure.getContext('2d');
        mctx.font = font;
        var lines = wrapLines(mctx, text, availableWidth);

        var m0 = mctx.measureText('Mg');
        var ascent = m0.actualBoundingBoxAscent || fontSize * 0.8;
        var descent = m0.actualBoundingBoxDescent || fontSize * 0.25;

        var lineWidths = lines.map(function (l) { return Math.ceil(mctx.measureText(l).width); });
        var textWidth = Math.max.apply(null, lineWidths);
        var textHeight = Math.ceil(ascent + (lines.length - 1) * lineHeight + descent + 4);

        measure.width = textWidth * dpr;
        measure.height = textHeight * dpr;
        mctx.scale(dpr, dpr);
        mctx.font = font;
        mctx.fillStyle = '#000';
        mctx.textBaseline = 'alphabetic';
        for (var li = 0; li < lines.length; li++) {
          mctx.fillText(lines[li], 0, ascent + 2 + li * lineHeight);
        }

        var pad = Math.round(Math.max(80, fontSize * 1.2));
        var canvasW = textWidth + pad * 2;
        var canvasH = textHeight + pad * 2;

        var img = mctx.getImageData(0, 0, measure.width, measure.height).data;
        var step = Math.max(2, Math.round(2 * dpr));
        var particles = [];
        for (var y = 0; y < measure.height; y += step) {
          for (var x = 0; x < measure.width; x += step) {
            if (img[(y * measure.width + x) * 4 + 3] > 128) {
              var ox = x / dpr + pad;
              var oy = y / dpr + pad;
              particles.push({
                x: ox + (Math.random() - 0.5) * 40,
                y: oy + (Math.random() - 0.5) * 40,
                ox: ox,
                oy: oy,
                vx: 0,
                vy: 0
              });
            }
          }
        }

        heading.textContent = '';
        var sr = document.createElement('span');
        sr.className = 'particle-sr';
        sr.textContent = text;
        heading.appendChild(sr);

        var holder = document.createElement('span');
        holder.className = 'particle-holder';
        holder.style.width = textWidth + 'px';
        holder.style.height = textHeight + 'px';
        heading.appendChild(holder);

        var canvas = document.createElement('canvas');
        canvas.className = 'particle-canvas';
        canvas.setAttribute('aria-hidden', 'true');
        canvas.width = canvasW * dpr;
        canvas.height = canvasH * dpr;
        canvas.style.width = canvasW + 'px';
        canvas.style.height = canvasH + 'px';
        canvas.style.left = -pad + 'px';
        canvas.style.top = -pad + 'px';
        holder.appendChild(canvas);

        var ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        var mouse = { x: -9999, y: -9999, active: false };
        window.addEventListener('pointermove', function (e) {
          var r = canvas.getBoundingClientRect();
          mouse.x = e.clientX - r.left;
          mouse.y = e.clientY - r.top;
          mouse.active = true;
        }, { passive: true });

        var radius = Math.max(40, fontSize * 0.6);
        var radiusSq = radius * radius;
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function frame() {
          ctx.clearRect(0, 0, canvasW, canvasH);
          ctx.fillStyle = textColor;
          var dotSize = Math.max(1, Math.round(dpr));
          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            var inside = false;
            if (mouse.active) {
              var dx = p.x - mouse.x;
              var dy = p.y - mouse.y;
              var dSq = dx * dx + dy * dy;
              if (dSq < radiusSq) {
                inside = true;
                var d = Math.sqrt(dSq) || 0.01;
                var tx = mouse.x + (dx / d) * radius;
                var ty = mouse.y + (dy / d) * radius;
                p.vx += (tx - p.x) * 0.18;
                p.vy += (ty - p.y) * 0.18;
                p.vx *= 0.72;
                p.vy *= 0.72;
              }
            }
            if (!inside) {
              p.vx += (p.ox - p.x) * 0.003;
              p.vy += (p.oy - p.y) * 0.003;
              p.vx *= 0.96;
              p.vy *= 0.96;
            }
            p.x += p.vx;
            p.y += p.vy;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), dotSize, dotSize);
          }
          if (!reduced) requestAnimationFrame(frame);
        }
        frame();

        var obs = new MutationObserver(function () {
          textColor = getComputedStyle(heading).color;
        });
        obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
      }

      function ready(fn) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
        else fn();
      }
      function buildAll() {
        document.querySelectorAll('#hero h1, #hero h2').forEach(build);
      }
      ready(function () {
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(buildAll);
        } else {
          setTimeout(buildAll, 50);
        }
      });
    })();
    </script>
