  title: "Arthur Morisson : dépannage de site web et visibilité sur Google"
  description: "Votre site est en panne, lent ou introuvable sur Google ? Développeur web indépendant, 8 ans d'expérience. Diagnostic gratuit sous 24 h, devis clair avant toute intervention."
  # Les mots du client dans la copie visible, le vocabulaire métier ici et dans
  # le JSON-LD : la cible ne tape pas "SEO", elle tape "mon site n'apparaît plus
  # sur Google".
  keywords:
    - "réparer site internet"
    - "dépannage site web"
    - "site web en panne"
    - "site internet lent"
    - "site n'apparaît pas sur Google"
    - "création site vitrine"
    - "création boutique en ligne"
    - "connecter CRM et ERP"
    - "développeur web freelance"
    - "SEO"
    - "Core Web Vitals"
  images:
    - "/images/moi-og.jpg"
  author: "Arthur Morisson"
  favicon: "/images/favicon.png"
  useBootstrapCDN: false
  # Charge static/style.css en dernier, après les CSS du thème. C'est le crochet
  # prévu par hugo-profile : nos surcharges gagnent sans !important et sans
  # bricoler la spécificité.
  customCSS: true
  mathjax: false
  animate: true

  theme: {}

  # Palette. Le bleu Bootstrap par défaut (#007bff) échouait au contraste sur le
  # fond clair (3,39 pour 4,5 exigé) sur la marque de la navbar et les liens, et
  # en mode sombre l'accent valait #ffffff, donc l'accent disparaissait : liens,
  # H1 et texte courant se confondaient tous en blanc.
  # Ratios mesurés sur les fonds réels (#eaedf0 et #18191a).
  color:
    textColor: "#343a40"           # 9,79 sur fond clair
    secondaryTextColor: "#55595c"  # 6,02, remplace #6c757d qui tombait à 3,99
    primaryColor: "#0f6466"        # 5,89, remplace #007bff à 3,39
    textLinkColor: "#0f6466"
    backgroundColor: "#eaedf0"
    secondaryColor: "#f8f9fa"
    darkmode:
      textColor: "#e4e6eb"           # 14,10 sur fond sombre
      secondaryTextColor: "#b0b3b8"  # 8,37
      primaryColor: "#5fd3d1"        # 9,83, remplace #ffffff
      textLinkColor: "#5fd3d1"
      backgroundColor: "#18191a"
      secondaryColor: "#212529"

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  navbar:
