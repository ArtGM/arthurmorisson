  about:
    enable: true
    title: "Services"
    content: |-
      **Votre site est en panne.** Site planté, erreur au chargement, formulaire qui n'envoie plus, mise à jour qui a tout cassé. Je reprends un site existant, même ancien et mal documenté, je le répare et je le sécurise.
      [Dépannage : processus et tarifs](/depannage-urgence/)

      **Votre site est lent, ou absent de Google.** Vos clients ne vous trouvent pas, ou abandonnent avant que la page s'affiche. Je trouve pourquoi, je corrige, et je vous montre le résultat en chiffres.

      **Vous n'avez pas de site, ou il est à refaire.** Site vitrine ou boutique en ligne, construits pour être trouvés sur Google dès le départ, et pour que vous puissiez les mettre à jour vous-même.
      [Création de site et de boutique](/creation-site/)

      **Vos outils ne se parlent pas.** Vous ressaisissez les mêmes informations dans votre logiciel de devis, votre fichier client et votre comptabilité. Je les connecte pour que ça se fasse tout seul.
      [Connexion de vos outils](/integration-outils/)

      Chaque intervention commence par un diagnostic gratuit et un ordre de prix. Vous décidez ensuite.

      <details>
        <summary>Voir les technologies que j'utilise</summary>
        <p>Pour les profils techniques : TypeScript, React, Vue, Node.js, API REST,
        PHP, Symfony, Laravel, PostgreSQL, MySQL, Docker. Côté référencement :
        Core Web Vitals, schema.org, sitemap, robots, hreflang, Search Console,
        Lighthouse, PageSpeed Insights.</p>
      </details>
    skills:
      # Remplacé par un <details> replié dans about.content : la cible n'est pas
      # technique, une liste de technologies en clair la faisait douter.
      enable: false
      title: "Pour les profils techniques :"
      items:
        - "TypeScript / JavaScript"
        - "React / Vue"
        - "Node.js / API REST"
        - "PHP / Symfony / Laravel"
        - "PostgreSQL / MySQL"
        - "Docker"
        - "SEO : Core Web Vitals, schema.org, sitemap, robots, hreflang"
        - "Search Console / Lighthouse / PageSpeed Insights"

